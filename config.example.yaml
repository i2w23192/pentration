# allscan configuration (copy to config.yaml, or pass with --config)
# Every key is optional; omitted keys fall back to built-in defaults.
# CLI flags and the TUI settings screen override anything set here.

# Concurrency / politeness --------------------------------------------------
threads: 20            # concurrent workers for DNS/port/web tasks
rate_limit: 10.0       # global cap on requests/second against the target (0 = unlimited)
timeout: 8.0           # per-network-operation timeout, seconds

# Port scanning -------------------------------------------------------------
full_ports: false      # true -> scan all 65535 ports (slow)
skip_nmap: false       # true -> never call nmap; use the built-in connect scanner
os_detection: false    # nmap -O (requires root/Administrator)

# Modules to run by default (TUI/CLI can narrow this) -----------------------
modules:
  - netdiscover        # ICMP ping sweep (CIDR), ARP neighbours, traceroute
  - recon              # subdomain & asset discovery
  - dnsx               # DNS deep-dive: SOA/SRV/CAA/DNSKEY, DNSSEC, cache snoop
  - email              # SPF / DKIM / DMARC posture
  - scan               # port/service scan
  - web                # web enumeration & content discovery
  - fingerprint        # API endpoints, CMS + version, framework detection
  - headers            # HTML source + security header analysis
  - tls                # SSL/TLS deep audit: protocol matrix, chain, expiry
  - cloud              # exposed cloud buckets + metadata-endpoint references
  - waf                # WAF/CDN fingerprint + rate-limit observation
  - vulns              # informational CVE correlation + misconfigs
  - compliance         # baseline pass/fail checklist roll-up (runs last)

# Network/host discovery ----------------------------------------------------
host_discovery_cidr: null   # explicit CIDR for the ping sweep; null -> /24 of target IP
host_discovery_max: 256     # cap on hosts swept per run

# Active probing (detection-only) -------------------------------------------
# Active checks SEND requests to CONFIRM weaknesses with benign markers — they
# never exploit, extract data or alter state. All of this is off by default and
# additionally requires the authorization gate + the --active flag / TUI toggle.
active: false                 # master switch (equivalent to --active)
scope_allow: []               # extra in-scope hosts/domains/CIDRs, e.g. ["api.example.com", "10.0.0.0/24"]
scope_deny: []                # always-blocked hosts/domains/CIDRs (denylist wins)
allow_production: false       # acknowledge a production target and silence the warning
active_max_concurrency: 8     # active-only worker cap (also bounded by `threads`)
active_max_urls: 25           # cap probed URLs per run
active_max_params: 6          # cap probed parameters per URL
active_stop_after_errors: 25  # auto-stop active probing after N consecutive request errors

# Output --------------------------------------------------------------------
output_dir: allscan-results   # JSON/MD/HTML reports + audit.log land here
follow_redirects: true
verify_tls: false      # recon routinely hits self-signed hosts; off by default

# Wordlists (null -> use the small built-in lists) --------------------------
wordlist_subdomains: null     # e.g. /usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt
wordlist_web: null            # e.g. /usr/share/seclists/Discovery/Web-Content/common.txt
max_subdomains_bruteforce: 2000

# DNS -----------------------------------------------------------------------
dns_resolvers:
  - 1.1.1.1
  - 8.8.8.8
  - 9.9.9.9

# CVE correlation -----------------------------------------------------------
# An NVD API key raises your rate limit from ~5 to ~50 requests/30s.
# Request one free at https://nvd.nist.gov/developers/request-an-api-key
nvd_api_key: null

# CVE data sources to query (any of: nvd, circl). Results are merged + deduped.
cve_sources: [nvd, circl]

# Exploit-reference enrichment -----------------------------------------------
# Optional local ExploitDB checkout CSV to resolve concrete EDB-IDs offline.
# References/intel only — allscan never downloads, embeds or runs exploit code.
#   e.g. /opt/exploitdb/files_exploits.csv
exploitdb_csv: null

# Reporting ------------------------------------------------------------------
pdf: false                    # also emit a ReportLab PDF (exec summary + risk table)

# Identification ------------------------------------------------------------
user_agent: "allscan/1.0 (authorized security testing)"
